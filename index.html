<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KLIKI Marketing</title>
  <meta name="description" content="Dashboard prestasi marketing media sosial KLIKI">
  <meta name="theme-color" content="#0A2E8A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KLIKI Marketing">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=10">
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Navigasi utama">
      <div class="side-brand">
        <img class="logo" src="icons/logo-white.png" alt="KLIKI" width="98" height="28">
        <span class="side-tag">Marketing</span>
      </div>
      <nav class="tabs" aria-label="Seksyen">
        <span class="nav-h">Mesyuarat bulanan</span>
        <button data-tab="overview" class="active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10.5V20h5v-6h4v6h5v-9.5"/></svg>
          <span>Overview</span>
        </button>
        <button data-tab="content">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm5 4.5v7l6-3.5z"/></svg>
          <span>Content</span>
        </button>
        <button data-tab="analisis">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4zm10 7h6v-9h-6zM4 20h6v-4H4zm10-11h6V4h-6z"/></svg>
          <span>Analisis</span>
        </button>
        <span class="nav-h">Drill-down</span>
        <button data-tab="funnel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
          <span>Funnel</span>
        </button>
        <button data-tab="outlet">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16v2a2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-5 0 2.5 2.5 0 0 1-6 0zm1 4v7h14v-7"/></svg>
          <span>Outlet</span>
        </button>
        <button data-tab="trend">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9M4 20h16"/></svg>
          <span>Trend</span>
        </button>
      </nav>
      <div class="side-foot">
        <span class="live-dot" aria-hidden="true"></span>
        <span>Data terus dari Google Sheet</span>
      </div>
    </aside>

    <div class="main-col">
      <header class="top">
        <div class="brand">
          <img class="logo m-logo" src="icons/logo-white.png" alt="KLIKI" width="98" height="28">
          <div class="ttl">
            <h1 id="page-title">Overview: Company Marketing</h1>
            <span id="status-line" class="status-line" role="status"></span>
          </div>
        </div>
        <div class="controls">
          <label class="sr" for="month">Bulan</label>
          <select id="month" aria-label="Pilih bulan"></select>
          <button id="info" class="icon-btn" aria-label="Status data & panduan" title="Status data">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
          <button id="refresh" class="icon-btn" aria-label="Muat semula data" title="Muat semula">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
          </button>
        </div>
      </header>

      <main id="view" tabindex="-1">
        <div class="loading"><div class="spinner"></div><p>Memuatkan data dari Google Sheet…</p></div>
      </main>
    </div>
  </div>

  <dialog id="info-dlg" aria-labelledby="info-title">
    <div class="dlg-head"><b id="info-title">Status data</b><button id="info-close" class="x" aria-label="Tutup">✕</button></div>
    <div id="info-body"></div>
  </dialog>

  <div id="tip" class="tip" role="tooltip" hidden></div>

  <script src="js/config.js?v=10"></script>
  <script src="js/data.js?v=10"></script>
  <script src="js/app.js?v=10"></script>
</body>
</html>
